<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ממלכת התבונה | אבטיפוס V1</title><style>*{box-sizing:border-box}body{margin:0;overflow:hidden;font-family:Arial,sans-serif;background:#a5d6fa}canvas{display:block}#hud{position:fixed;top:15px;right:15px;color:#fff;background:#13243bc9;padding:15px 19px;border:1px solid #ffffff55;border-radius:18px;max-width:min(370px,90vw);line-height:1.65;box-shadow:0 10px 30px #0003}h1{font-size:23px;margin:0 0 4px}#status{font-size:15px}#help{font-size:13px;color:#d7ecff}button{font:inherit;cursor:pointer;border:0;border-radius:13px;padding:10px 17px;background:#ffcf65;color:#263042;font-weight:bold}#action{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);display:none;font-size:17px;box-shadow:0 5px 20px #0005;white-space:nowrap}#back{display:none;margin-top:9px}#lab{display:none;position:fixed;left:15px;top:15px;background:#142b48df;color:white;border-radius:18px;padding:16px;max-width:330px;line-height:1.5}#lab input{width:100%;accent-color:#ffcb58}#degrees{font-size:24px;font-weight:bold;color:#ffdb7b}#notice{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);color:white;background:#152b43dd;border-radius:12px;padding:10px 16px;display:none}#mobile{position:fixed;bottom:20px;right:18px;display:grid;grid-template-columns:repeat(3,53px);gap:5px;direction:ltr}#mobile button{padding:10px 0;background:#ffffffc9;touch-action:none}#mobile .empty{visibility:hidden}@media(pointer:fine){#mobile{opacity:.55}}@media(max-width:600px){#hud{max-width:65vw;padding:10px}h1{font-size:17px}#help{font-size:11px}#lab{top:auto;bottom:145px;left:10px;max-width:220px;padding:11px}#action{bottom:100px}}</style></head><body><div id="hud"><h1 id="title">👑 ממלכת התבונה</h1><div id="status">ברוכים הבאים לכיכר הממלכה!</div><div id="help">חצים / WASD לתנועה · התקרבו לשער הזוהר</div><button id="back">↩ חזרה לכיכר</button></div><div id="lab"><b>🎠 קרוסלת הסיבובים</b><p>בחרו זווית וראו כיצד הצורה מסתובבת סביב המרכז.</p><div id="degrees">90°</div><input id="angle" type="range" min="-180" max="180" step="15" value="90"><div style="display:flex;gap:8px"><button id="spin">סובבו!</button><button id="reset">איפוס</button></div><small>כיוון חיובי: נגד כיוון השעון במבט מלמעלה</small></div><button id="action">✨ כניסה לממלכת התנועה</button><div id="notice"></div><div id="mobile"><span class="empty"></span><button data-key="ArrowUp">▲</button><span class="empty"></span><button data-key="ArrowLeft">◀</button><button data-key="ArrowDown">▼</button><button data-key="ArrowRight">▶</button></div><script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js';
const scene=new THREE.Scene();scene.background=new THREE.Color(0x9ad9fb);scene.fog=new THREE.Fog(0x9ad9fb,32,95);const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,160);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;renderer.outputColorSpace=THREE.SRGBColorSpace;document.body.prepend(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xffffff,0x72946d,2));const sun=new THREE.DirectionalLight(0xfff3c7,2.3);sun.position.set(-10,24,12);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);sun.shadow.camera.left=-40;sun.shadow.camera.right=40;sun.shadow.camera.top=40;sun.shadow.camera.bottom=-40;scene.add(sun);
const mat=(color,metalness=0)=>new THREE.MeshStandardMaterial({color,roughness:.66,metalness});const ground=mat(0x7ac98d),stone=mat(0xece1c4),gold=mat(0xffd46d,.35),purple=mat(0x9060bf),blue=mat(0x548bd6),pink=mat(0xe890b5);const world=new THREE.Group(),realm=new THREE.Group();scene.add(world,realm);const box=(p,w,h,d,x,y,z,m)=>{const a=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);a.position.set(x,y,z);a.castShadow=true;a.receiveShadow=true;p.add(a);return a};const cyl=(p,r1,r2,h,x,y,z,m,n=16)=>{const a=new THREE.Mesh(new THREE.CylinderGeometry(r1,r2,h,n),m);a.position.set(x,y,z);a.castShadow=true;p.add(a);return a};const sphere=(p,r,x,y,z,m)=>{const a=new THREE.Mesh(new THREE.SphereGeometry(r,16,12),m);a.position.set(x,y,z);a.castShadow=true;p.add(a);return a};function label(parent,txt,x,y,z,w=7){const c=document.createElement('canvas');c.width=1024;c.height=256;const ctx=c.getContext('2d');ctx.fillStyle='#26365e';ctx.roundRect(12,20,1000,214,45);ctx.fill();ctx.strokeStyle='#f7d581';ctx.lineWidth=12;ctx.stroke();ctx.font='bold 95px Arial';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle='white';ctx.fillText(txt,512,130);const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;const s=new THREE.Mesh(new THREE.PlaneGeometry(w,w/4),new THREE.MeshBasicMaterial({map:t,transparent:true,side:THREE.DoubleSide}));s.position.set(x,y,z);parent.add(s);return s}
box(world,120,.5,120,0,-.28,0,ground);box(world,7,.06,32,0,.02,-7,stone);box(world,19,.06,7,0,.03,-12,stone);for(let i=0;i<28;i++){const a=i*2.4,r=23+(i%4)*3,x=Math.sin(a)*r,z=Math.cos(a)*r;sphere(world,1.6,x,2.6,z,mat(i%2?0x4c9b65:0x63b878));cyl(world,.3,.4,2.3,x,1.1,z,mat(0x765b40))}
// Castle and portal
box(world,12,7,5,0,3.5,-27,stone);for(const x of [-5.5,5.5]){cyl(world,1.9,2.2,10,x,5,-27,purple,10);const roof=new THREE.Mesh(new THREE.ConeGeometry(2.6,4,10),pink);roof.position.set(x,12,-27);world.add(roof)}box(world,3.4,5,.3,0,2.5,-24.4,blue);label(world,'ארמון התבונה',0,10,-24,7);
const gate=new THREE.Group();gate.position.set(0,0,-13);world.add(gate);for(const x of [-3.1,3.1]){box(gate,1.1,7,1.4,x,3.5,0,purple);sphere(gate,.75,x,7.4,0,gold)}box(gate,7,1.3,1.5,0,7.2,0,gold);const portal=new THREE.Mesh(new THREE.PlaneGeometry(5.2,6.3),new THREE.MeshBasicMaterial({color:0x67e6ef,transparent:true,opacity:.6,side:THREE.DoubleSide}));portal.position.y=3.2;gate.add(portal);label(gate,'ממלכת התנועה',0,9.3,.9,7.5);
for(let i=0;i<8;i++){const a=i*Math.PI/4,x=Math.sin(a)*12,z=Math.cos(a)*12-4;cyl(world,.6,.75,2,x,1,z,mat(0xe5bd6e));sphere(world,.75,x,2.2,z,mat(i%2?0xffa8cb:0xffe39a))}
// Independent motion realm
box(realm,110,.5,110,0,-.28,0,mat(0x8fc8c4));for(let i=0;i<12;i++){let a=i*Math.PI/6;cyl(realm,.35,.5,5,Math.sin(a)*17,2.5,Math.cos(a)*17,stone);sphere(realm,.6,Math.sin(a)*17,5.3,Math.cos(a)*17,gold)}label(realm,'ממלכת התנועה',0,9,-13,9);const ride=new THREE.Group();ride.position.set(0,0,-5);realm.add(ride);cyl(ride,5.2,5.2,.55,0,.35,0,purple,48);cyl(ride,.45,.55,7,0,3.8,0,gold);const canopy=new THREE.Mesh(new THREE.ConeGeometry(6,3.2,12),pink);canopy.position.y=8;ride.add(canopy);const spinner=new THREE.Group();spinner.position.y=.8;ride.add(spinner);const shapeColors=[0xffd15d,0x6dd6f2,0xf39cc1,0xb7e183];for(let i=0;i<4;i++){let a=i*Math.PI/2,x=Math.cos(a)*3,z=Math.sin(a)*3;cyl(spinner,.09,.09,3,x,2,z,gold);box(spinner,1.2,1.2,1.2,x,.7,z,mat(shapeColors[i]));}const axis=new THREE.AxesHelper(3);axis.position.set(0,1.5,0);spinner.add(axis);
const avatar=new THREE.Group();scene.add(avatar);cyl(avatar,.46,.52,1.2,0,1,0,blue);sphere(avatar,.49,0,1.98,0,mat(0xffd2a6));box(avatar,.23,.8,.3,-.28,.18,0,mat(0x34466e));box(avatar,.23,.8,.3,.28,.18,0,mat(0x34466e));sphere(avatar,.52,0,2.35,-.07,mat(0x503c6b));const keys=new Set();let inRealm=false,spinning=false,target=0;const action=document.getElementById('action'),back=document.getElementById('back'),lab=document.getElementById('lab');function switchRealm(v){inRealm=v;world.visible=!v;realm.visible=v;avatar.position.set(0,0,v?9:9);avatar.rotation.y=0;scene.background.setHex(v?0x94bcd8:0x9ad9fb);scene.fog.color.setHex(v?0x94bcd8:0x9ad9fb);document.getElementById('title').textContent=v?'🎠 ממלכת התנועה':'👑 ממלכת התבונה';document.getElementById('status').textContent=v?'גלו את קרוסלת הסיבובים':'ברוכים הבאים לכיכר הממלכה!';back.style.display=v?'inline-block':'none';lab.style.display=v?'block':'none';action.style.display='none';}switchRealm(false);action.onclick=()=>switchRealm(true);back.onclick=()=>switchRealm(false);document.getElementById('angle').oninput=e=>document.getElementById('degrees').textContent=e.target.value+'°';document.getElementById('spin').onclick=()=>{target+=Number(document.getElementById('angle').value)*Math.PI/180;spinning=true};document.getElementById('reset').onclick=()=>{target=0;spinning=true};window.addEventListener('keydown',e=>{if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();keys.add(e.key.toLowerCase())});window.addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));document.querySelectorAll('#mobile button').forEach(b=>{let k=b.dataset.key.toLowerCase();b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture(e.pointerId);keys.add(k)});for(let ev of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(ev,()=>keys.delete(k))});
let last=performance.now();function loop(now){requestAnimationFrame(loop);let dt=Math.min((now-last)/1000,.05);last=now;const x=(keys.has('arrowright')||keys.has('d')?1:0)-(keys.has('arrowleft')||keys.has('a')?1:0),z=(keys.has('arrowdown')||keys.has('s')?1:0)-(keys.has('arrowup')||keys.has('w')?1:0);if(x||z){const l=Math.hypot(x,z);avatar.position.x+=x/l*7*dt;avatar.position.z+=z/l*7*dt;avatar.rotation.y=Math.atan2(x/l,-z/l);avatar.position.x=THREE.MathUtils.clamp(avatar.position.x,-26,26);avatar.position.z=THREE.MathUtils.clamp(avatar.position.z,-28,27)}const dest=new THREE.Vector3(avatar.position.x,avatar.position.y+5.5,avatar.position.z+11);camera.position.lerp(dest,1-Math.exp(-4*dt));camera.lookAt(avatar.position.x,1.8,avatar.position.z-4);if(!inRealm){const close=Math.hypot(avatar.position.x,avatar.position.z+13)<4.5;action.style.display=close?'block':'none';portal.material.opacity=.45+.18*Math.sin(now*.003)}if(spinning){const diff=target-spinner.rotation.y;spinner.rotation.y+=Math.sign(diff)*Math.min(Math.abs(diff),dt*1.7);if(Math.abs(diff)<.001)spinning=false}renderer.render(scene,camera)}requestAnimationFrame(loop);window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
